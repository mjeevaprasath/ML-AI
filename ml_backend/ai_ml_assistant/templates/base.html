<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>

    <!-- ✅ FIX favicon (optional but no error) -->
    <link rel="icon" href="/static/images/favicon.ico">

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        #avatar-container {
            width: 100%;
            height: 400px;
            background: #111;
        }

        #chat-box {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            margin: 5px 0;
        }

        #mic-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #00bcd4;
            border: none;
            color: white;
            cursor: pointer;
        }

        #mic-btn:hover {
            background: #0097a7;
        }
    </style>
</head>

<body>

    {% block content %}{% endblock %}

</body>
</html>
